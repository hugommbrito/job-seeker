# The model gateway (LiteLLM proxy). It runs as its own Coolify resource, so the provider key and
# the master key never reach the app's services (ADR 0008). Every secret below is read from the
# gateway's own environment (os.environ/...); none is written in this file.

model_list:
  # One alias per task, all on the same model until the eval justifies a cheaper one
  # (implementation plan, section 3.4). The app asks for the alias, never for a model id.
  - model_name: extractor
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: fit-judge
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: email-classifier
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: writer
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # The `embedder` alias (OpenAI) is added in Phase 2, when the embedding model is chosen.

litellm_settings:
  # Postings, emails and CV text are never sent to logging callbacks; request metadata still is.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Spend is tracked per call. Prompts and answers are not stored with it: this is the default,
  # stated so that changing it is a visible decision.
  store_prompts_in_spend_logs: false
