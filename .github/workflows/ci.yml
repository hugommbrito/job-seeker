name: CI

# CI holds no secrets. It never talks to a job source, a model or a mailbox: probe, verify and
# eval commands are run by hand. The passwords below belong to a database that exists for the
# length of one job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The real commits, not the merge commit GitHub synthesises for a pull request.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The denylist is private, so that check is skipped here and enforced by the local hooks.
      - name: File types and commit identities, over the full history
        run: python3 scripts/hygiene.py history
      # Run as the checkout's owner, or git inside the container refuses the repository.
      - name: Secrets, over the full history
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Tests connect as `app`, the role row-level security binds; `migrator` creates and
      # migrates the test database.
      DATABASE_URL: postgres://app:ci-app@127.0.0.1:5432/jobseeker
      MIGRATOR_DATABASE_URL: postgres://migrator:ci-migrator@127.0.0.1:5432/jobseeker
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Create database roles and extensions
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: ci-superuser
          MIGRATOR_DB_PASSWORD: ci-migrator
          APP_DB_PASSWORD: ci-app
          MIGRATOR_CREATEDB: "1"
        run: infra/postgres/bootstrap.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-types:
    name: API types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # The web client's types are generated from the API's OpenAPI schema. Both generated
      # files are committed; a difference here means someone changed the API and did not run
      # `make api-types`.
      - run: make api-types PNPM="cd web && pnpm"
      - run: git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f infra/Dockerfile -t job-seeker:ci .
